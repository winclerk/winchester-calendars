<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Community Room @ Library – Availability</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }

  .clip {
    position: fixed;
    /* Push inward to hide Outlook's border/shadow */
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }

  iframe {
    position: absolute;
    /* Shift up to hide Outlook's top toolbar (~100px) */
    top: -100px;
    /* Shift left slightly */
    left: -1px;
    /* Wider than viewport to push right scrollbar/sidebar off screen */
    width: calc(100% + 2px);
    /* Taller than viewport to push bottom bar off screen */
    height: calc(100% + 140px);
    border: none;
    display: block;
  }
</style>
</head>
<body>
<div class="clip">
  <iframe
    src="https://outlook.office365.com/owa/calendar/8eaf6b54b3434f6f9552b0d37246e08c@winchester.wi.gov/416fcd89adb247b9a16e5015b570f6224865752660822258858/calendar.html"
    scrolling="no"
    title="Community Room @ Library availability">
  </iframe>
</div>
</body>
</html>
