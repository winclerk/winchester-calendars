<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Community Room – Availability</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
  .clip {
    position: fixed;
    top: 0; left: 0;
    /* Clip enough to hide the day panel on the right */
    right: 220px;
    bottom: 0;
    overflow: hidden;
  }
  iframe {
    position: absolute;
    top: -100px;
    left: -1px;
    /* Make iframe wider than clip so all 7 columns are visible inside the clip */
    width: calc(100% + 230px);
    height: calc(100% + 140px);
    border: none;
    display: block;
  }
</style>
</head>
<body>
<div class="clip">
  <iframe
    src="https://outlook.office365.com/owa/calendar/8eaf6b54b3434f6f9552b0d37246e08c@winchester.wi.gov/416fcd89adb247b9a16e5015b570f6224865752660822258858/calendar.html"
    scrolling="no"
    title="Community Room availability">
  </iframe>
</div>
</body>
</html>
